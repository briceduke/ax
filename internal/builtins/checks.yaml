- id: ax-format
  builtin: ax-format
  inputs:
    - log/**/*.md
    - core/capabilities/*.md
    - core/scaffolds/*.md
    - core/evals/*.md
  tier: fast
  enforces: {{enforces}}
- id: ax-consistency
  builtin: ax-consistency
  inputs:
    - core/checks.yaml
    - core/scaffolds/*.md
    - log/**/*.md
  tier: fast
  enforces: {{enforces}}
- id: ax-staleness
  builtin: ax-staleness
  inputs:
    - ax.yaml
    - core/intent.md
    - core/capabilities/*.md
    - core/scaffolds/*.md
    - core/evals/*.md
    - core/checks.yaml
    - .generated/manifest.yaml
  tier: fast
  enforces: {{enforces}}
